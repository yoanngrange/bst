<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BST — Prochains passages</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#082400">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #f2f3f5;
    --muted: #8b93a5;
    --accent: #ffcc33;
    /* Official Naolib per-line colors */
    --line-T2: #E30613;
    --line-T3: #2581C4;
    --line-4:  #FFCD1C;
    --line-5:  #0BBBEF;
    --line-38: #009640;
    --line-26: #009640;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  header {
    max-width: 640px;
    margin: 0 auto 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.3px;
  }
  .updated {
    font-size: 12px;
    color: var(--muted);
  }
  .list {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .badge {
    min-width: 46px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 8px;
    color: #10121a;
  }
  .filters {
    max-width: 640px;
    margin: 0 auto 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .filter-chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s;
  }
  .filter-chip.active {
    opacity: 1;
  }
  .info {
    flex: 1;
    min-width: 0;
  }
  .direction {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stop {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .time {
    font-size: 20px;
    font-weight: 700;
    min-width: 58px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .time.soon { color: var(--accent); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }
  .mock-notice {
    max-width: 640px;
    margin: 0 auto 16px;
    font-size: 12px;
    color: var(--muted);
    background: #1d1a10;
    border: 1px solid #3a300f;
    padding: 8px 12px;
    border-radius: 8px;
  }
  .install-banner {
    max-width: 640px;
    margin: 0 auto 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: none;
    align-items: center;
    gap: 12px;
  }
  .install-banner.visible {
    display: flex;
  }
  .install-banner img {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    flex-shrink: 0;
  }
  .install-banner .text {
    flex: 1;
    font-size: 13px;
    line-height: 1.4;
  }
  .install-banner .text strong {
    display: block;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .install-banner button.install-action {
    background: #6CD100;
    color: #082400;
    border: none;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .install-banner button.dismiss {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Prochains passages</h1>
  <div class="updated" id="updated">—</div>
</header>

<div class="install-banner" id="installBanner">
  <img src="icon-192.png" alt="BST">
  <div class="text" id="installText"><strong>Installer BST</strong></div>
  <button class="install-action" id="installAction" style="display:none;">Installer</button>
  <button class="dismiss" id="installDismiss" aria-label="Fermer">✕</button>
</div>

<div class="mock-notice">
  ⚠️ Données simulées (mock) — en attente de la clé API SIRI-Lite Naolib.
  Le format suit la structure réelle de l'API (StopMonitoringDelivery / MonitoredStopVisit) pour un remplacement facile.
</div>

<div class="filters" id="filters"></div>

<div class="list" id="list"></div>

<script>
/* ------------------------------------------------------------------
   CONFIG: the 5 monitored points, mapped from your NeTEx investigation
------------------------------------------------------------------- */
const MONITORED_POINTS = [
  { monitoringRef: "MGIN1", lineCode: "T2", direction: "Orvault Grd-Val", stopName: "Mangin"          },
  { monitoringRef: "MGIN1", lineCode: "T3", direction: "Marcel Paul",     stopName: "Mangin"          },
  { monitoringRef: "IDNA1", lineCode: "5",  direction: "Hangar à Bananes",stopName: "Île de Nantes"   },
  { monitoringRef: "GNRA4", lineCode: "38", direction: "Aéroport",        stopName: "Greneraie"       },
  { monitoringRef: "BENA1", lineCode: "4",  direction: "Foch - Cathédrale",stopName: "Beaulieu"       },
  // Line 26 (→ Jonelière) at Monzie: line is currently diverted (works), so we
  // don't yet know which quay is the Jonelière-bound platform. Both are added
  // temporarily — drop whichever turns out wrong once real API data confirms it.
  { monitoringRef: "MOZI1", lineCode: "26", direction: "Jonelière", stopName: "Monzie" },
  { monitoringRef: "MOZI2", lineCode: "26", direction: "Jonelière", stopName: "Monzie" },
];

// Official Naolib per-line colors (from line pictogram SVGs)
const LINE_COLORS = {
  T2: { bg: "#E30613", text: "#FFFFFF" },
  T3: { bg: "#2581C4", text: "#FFFFFF" },
  "4": { bg: "#FFCD1C", text: "#111111" },
  "5": { bg: "#0BBBEF", text: "#111111" },
  "38": { bg: "#009640", text: "#FFFFFF" },
  "26": { bg: "#009640", text: "#FFFFFF" },
};

const WINDOW_MINUTES = 30;
const REFRESH_SECONDS = 30;

// Filter state: Set of active line codes. Empty Set = show all.
const activeFilters = new Set();

/* ------------------------------------------------------------------
   MOCK DATA — shaped exactly like a real SIRI-Lite StopMonitoring
   response body (Siri.ServiceDelivery.StopMonitoringDelivery[0]
   .MonitoredStopVisit[]), one fake payload per MonitoringRef.
   Swap fetchStopMonitoring() below for a real call when the key
   is ready — nothing else needs to change.
------------------------------------------------------------------- */
function mockResponseFor(monitoringRef) {
  const now = Date.now();
  const mins = (m) => new Date(now + m * 60000).toISOString();

  const fakePassages = {
    MGIN1: [
      { LineRef: "T2", PublishedLineName: "T2", DestinationName: "Orvault Grand Val", ExpectedArrivalTime: mins(5) },
      { LineRef: "T3", PublishedLineName: "T3", DestinationName: "Marcel Paul",       ExpectedArrivalTime: mins(6) },
      { LineRef: "T2", PublishedLineName: "T2", DestinationName: "Orvault Grand Val", ExpectedArrivalTime: mins(12) },
      { LineRef: "T3", PublishedLineName: "T3", DestinationName: "Marcel Paul",       ExpectedArrivalTime: mins(21) },
      { LineRef: "T2", PublishedLineName: "T2", DestinationName: "Orvault Grand Val", ExpectedArrivalTime: mins(19) },
    ],
    IDNA1: [
      { LineRef: "5", PublishedLineName: "5", DestinationName: "Hangar à Bananes", ExpectedArrivalTime: mins(5) },
      { LineRef: "5", PublishedLineName: "5", DestinationName: "Hangar à Bananes", ExpectedArrivalTime: mins(17) },
    ],
    GNRA4: [
      { LineRef: "38", PublishedLineName: "38", DestinationName: "Aéroport", ExpectedArrivalTime: mins(26) },
    ],
    BENA1: [
      { LineRef: "4", PublishedLineName: "4", DestinationName: "Foch - Cathédrale", ExpectedArrivalTime: mins(3) },
      { LineRef: "4", PublishedLineName: "4", DestinationName: "Foch - Cathédrale", ExpectedArrivalTime: mins(14) },
    ],
    // Both Monzie quays mocked temporarily — see comment in MONITORED_POINTS above.
    MOZI1: [
      { LineRef: "26", PublishedLineName: "26", DestinationName: "Jonelière", ExpectedArrivalTime: mins(9) },
      { LineRef: "26", PublishedLineName: "26", DestinationName: "Jonelière", ExpectedArrivalTime: mins(24) },
    ],
    MOZI2: [
      { LineRef: "26", PublishedLineName: "26", DestinationName: "Jonelière", ExpectedArrivalTime: mins(16) },
    ],
  };

  const visits = (fakePassages[monitoringRef] || []).map((p, i) => ({
    RecordedAtTime: new Date(now).toISOString(),
    ItemIdentifier: `MOCK:${monitoringRef}:${i}`,
    MonitoringRef: { value: monitoringRef },
    MonitoredVehicleJourney: {
      LineRef: { value: p.LineRef },
      PublishedLineName: [{ value: p.PublishedLineName }],
      DestinationName: [{ value: p.DestinationName }],
      MonitoredCall: {
        ExpectedArrivalTime: p.ExpectedArrivalTime,
      },
    },
  }));

  return {
    Siri: {
      ServiceDelivery: {
        ResponseTimestamp: new Date(now).toISOString(),
        StopMonitoringDelivery: [
          { MonitoredStopVisit: visits },
        ],
      },
    },
  };
}

/* ------------------------------------------------------------------
   REAL CALL (disabled until API key is available) — kept here so
   swapping to live data later is a one-line change in loadAll().

async function fetchStopMonitoring(monitoringRef) {
  const url = `https://api.okina.fr/.../stop-monitoring.json?MonitoringRef=${monitoringRef}`;
  const res = await fetch(url, {
    headers: { "X-Gravitee-Api-Key": "YOUR_KEY_HERE" }
  });
  if (!res.ok) throw new Error(`SIRI request failed: ${res.status}`);
  return res.json();
}
------------------------------------------------------------------- */

async function fetchStopMonitoring(monitoringRef) {
  // MOCK MODE — replace this line with the real fetchStopMonitoring above
  return Promise.resolve(mockResponseFor(monitoringRef));
}

function extractVisits(siriResponse) {
  try {
    return siriResponse.Siri.ServiceDelivery.StopMonitoringDelivery[0].MonitoredStopVisit || [];
  } catch (e) {
    return [];
  }
}

function minutesFromNow(isoTime) {
  const diffMs = new Date(isoTime).getTime() - Date.now();
  return Math.max(0, Math.round(diffMs / 60000));
}

async function loadAll() {
  const now = new Date();
  document.getElementById("updated").textContent =
    "Mis à jour " + now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // Group config by monitoringRef to avoid duplicate calls (Mangin = T2 + T3, same quay)
  const uniqueRefs = [...new Set(MONITORED_POINTS.map(p => p.monitoringRef))];
  const responses = {};
  await Promise.all(uniqueRefs.map(async (ref) => {
    responses[ref] = extractVisits(await fetchStopMonitoring(ref));
  }));

  const rows = [];
  for (const point of MONITORED_POINTS) {
    const visits = responses[point.monitoringRef] || [];
    for (const visitـ of visits) {
      const mvj = visitـ.MonitoredVehicleJourney;
      const lineRef = mvj.LineRef?.value || mvj.PublishedLineName?.[0]?.value;
      if (lineRef !== point.lineCode) continue; // filter to the line we care about at this quay

      const arrivalIso = mvj.MonitoredCall?.ExpectedArrivalTime;
      if (!arrivalIso) continue;

      const mins = minutesFromNow(arrivalIso);
      if (mins > WINDOW_MINUTES) continue;

      rows.push({
        line: point.lineCode,
        direction: point.direction,
        stopName: point.stopName,
        minutes: mins,
      });
    }
  }

  rows.sort((a, b) => a.minutes - b.minutes);
  renderFilters();
  render(rows);
}

function renderFilters() {
  const container = document.getElementById("filters");
  // Build the chip list once from the lines actually configured
  const lines = [...new Set(MONITORED_POINTS.map(p => p.lineCode))];
  if (container.dataset.built === "true") {
    // just refresh active state
    [...container.children].forEach(chip => {
      chip.classList.toggle("active", activeFilters.size === 0 || activeFilters.has(chip.dataset.line));
    });
    return;
  }
  container.dataset.built = "true";
  container.innerHTML = "";
  for (const line of lines) {
    const chip = document.createElement("button");
    chip.className = "filter-chip active";
    chip.textContent = line;
    chip.dataset.line = line;
    chip.style.borderColor = (LINE_COLORS[line] || {}).bg || "var(--border)";
    chip.addEventListener("click", () => {
      if (activeFilters.has(line)) {
        activeFilters.delete(line);
      } else {
        activeFilters.add(line);
      }
      // If every line ends up selected, treat as "show all" (empty set)
      if (activeFilters.size === lines.length) activeFilters.clear();
      loadAll();
    });
    container.appendChild(chip);
  }
}

function render(rows) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  const filtered = activeFilters.size === 0
    ? rows
    : rows.filter(r => activeFilters.has(r.line));

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">Aucun passage dans les ${WINDOW_MINUTES} prochaines minutes.</div>`;
    return;
  }

  for (const r of filtered) {
    const colors = LINE_COLORS[r.line] || { bg: "#666", text: "#fff" };
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="badge" style="background:${colors.bg};color:${colors.text}">${r.line}</div>
      <div class="info">
        <div class="direction">→ ${r.direction}</div>
        <div class="stop">${r.stopName}</div>
      </div>
      <div class="time ${r.minutes <= 5 ? 'soon' : ''}">${r.minutes} min</div>
    `;
    list.appendChild(row);
  }
}

loadAll();
setInterval(loadAll, REFRESH_SECONDS * 1000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ------------------------------------------------------------------
   PWA install banner
   - iOS/iPadOS Safari and macOS Safari have no native install prompt,
     so we show manual "Add to Home Screen" / "Add to Dock" instructions.
   - Chrome/Edge/Android expose beforeinstallprompt, so we show a real
     "Install" button that triggers the native dialog.
   - Hidden entirely once the app is already running standalone, or
     if the person dismissed it (remembered for 14 days).
------------------------------------------------------------------- */
(function setupInstallBanner() {
  const DISMISS_KEY = "bst-install-dismissed-until";
  const DISMISS_DAYS = 14;

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true; // iOS Safari flag

  if (isStandalone) return;

  const dismissedUntil = Number(localStorage.getItem(DISMISS_KEY) || 0);
  if (Date.now() < dismissedUntil) return;

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes("Macintosh") && navigator.maxTouchPoints > 1);
  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
  const isMac = /Macintosh/.test(ua) && !isIOS;

  const banner = document.getElementById("installBanner");
  const textEl = document.getElementById("installText");
  const actionBtn = document.getElementById("installAction");
  const dismissBtn = document.getElementById("installDismiss");

  let deferredPrompt = null;

  function show(html) {
    textEl.innerHTML = html;
    banner.classList.add("visible");
  }

  dismissBtn.addEventListener("click", () => {
    localStorage.setItem(DISMISS_KEY, String(Date.now() + DISMISS_DAYS * 86400000));
    banner.classList.remove("visible");
  });

  if (isIOS && isSafari) {
    show(`<strong>Installer BST</strong>Appuyez sur <strong>Partager</strong> (icône carrée avec flèche ↑) puis <strong>Sur l'écran d'accueil</strong>.`);
  } else if (isMac && isSafari) {
    show(`<strong>Installer BST</strong>Cliquez sur <strong>Partager</strong> dans la barre d'outils puis <strong>Ajouter au Dock</strong>.`);
  } else {
    // Chrome / Edge / other browsers supporting the native install prompt
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      show(`<strong>Installer BST</strong>Ajoutez l'app à votre écran d'accueil pour un accès rapide.`);
      actionBtn.style.display = "inline-block";
    });

    actionBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.classList.remove("visible");
    });
  }
})();

</script>

</body>
</html>
