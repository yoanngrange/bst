<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BST — Prochains passages</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#082400">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b36;
    --text: #f2f3f5;
    --muted: #8b93a5;
    --accent: #ffcc33;
    /* Official Naolib per-line colors */
    --line-T2: #E30613;
    --line-T3: #2581C4;
    --line-4:  #FFCD1C;
    --line-5:  #0BBBEF;
    --line-38: #009640;
    --line-26: #009640;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }
  header {
    max-width: 640px;
    margin: 0 auto 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.3px;
  }
  .updated {
    font-size: 12px;
    color: var(--muted);
  }
  .list {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .badge {
    min-width: 46px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 8px;
    color: #10121a;
  }
  .filters {
    max-width: 640px;
    margin: 0 auto 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .filter-chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s;
  }
  .filter-chip.active {
    opacity: 1;
  }
  .info {
    flex: 1;
    min-width: 0;
  }
  .direction {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stop {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }
  .time {
    font-size: 20px;
    font-weight: 700;
    min-width: 58px;
    max-width: 40%;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .time.multi {
    font-size: 15px;
    line-height: 1.4;
  }
  .time .soon { color: var(--accent); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }
  .mock-notice {
    max-width: 640px;
    margin: 0 auto 16px;
    font-size: 12px;
    color: var(--muted);
    background: #1d1a10;
    border: 1px solid #3a300f;
    padding: 8px 12px;
    border-radius: 8px;
  }
  .install-banner {
    max-width: 640px;
    margin: 0 auto 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: none;
    align-items: center;
    gap: 12px;
  }
  .install-banner.visible {
    display: flex;
  }
  .install-banner img {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    flex-shrink: 0;
  }
  .install-banner .text {
    flex: 1;
    font-size: 13px;
    line-height: 1.4;
  }
  .install-banner .text strong {
    display: block;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .install-banner button.install-action {
    background: #6CD100;
    color: #082400;
    border: none;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .install-banner button.dismiss {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Prochains passages</h1>
  <div class="updated" id="updated">—</div>
</header>

<div class="install-banner" id="installBanner">
  <img src="icon-192.png" alt="BST">
  <div class="text" id="installText"><strong>Installer BST</strong></div>
  <button class="install-action" id="installAction" style="display:none;">Installer</button>
  <button class="dismiss" id="installDismiss" aria-label="Fermer">✕</button>
</div>

<div class="mock-notice" id="mockNotice">
  ⚠️ Données simulées (mock) — en attente de la clé API SIRI-Lite Naolib.
  Le format suit la structure réelle de l'API (StopMonitoringDelivery / MonitoredStopVisit) pour un remplacement facile.
</div>

<div class="filters" id="filters"></div>
<div class="filters" id="lineFilters"></div>

<div class="list" id="list"></div>

<script>
/* ------------------------------------------------------------------
   CONFIG: monitored points, mapped from your NeTEx investigation.
   Each has a stable `id`, referenced by USER_POINT_IDS below to build
   the per-user filtered + ordered view.
------------------------------------------------------------------- */
const MONITORED_POINTS = [
  { id: "mgin-t2",           monitoringRef: "MGIN1", apiLineRef: "2",  lineCode: "T2", direction: "Orvault Grd-Val", stopName: "Mangin"          },
  { id: "mgin-t3-marcelpaul",monitoringRef: "MGIN1", apiLineRef: "3",  lineCode: "T3", direction: "Marcel Paul",     stopName: "Mangin"          },
  // Marie & Martine also take T3 → Neustrie (opposite platform from the
  // Marcel Paul side above). MGIN2 confirmed via real API data (2026-09-21).
  { id: "mgin-t3-neustrie",  monitoringRef: "MGIN2", apiLineRef: "3",  lineCode: "T3", direction: "Neustrie",        stopName: "Mangin"          },
  { id: "idna-5",            monitoringRef: "IDNA1", apiLineRef: "5",  lineCode: "5",  direction: "Hangar à Bananes",stopName: "Île de Nantes"   },
  { id: "gnra-38-aeroport",  monitoringRef: "GNRA4", apiLineRef: "38", lineCode: "38", direction: "Aéroport",        stopName: "Greneraie"       },
  { id: "bena-4",            monitoringRef: "BENA1", apiLineRef: "4",  lineCode: "4",  direction: "Foch - Cathédrale",stopName: "Beaulieu"       },
  // Line 26 (→ Jonelière): confirmed via real API data (2026-09-11) that the
  // ongoing works diversion currently routes it through Île de Nantes (IDNA1),
  // not its normal Monzie stop. Re-checked 2026-09-22 via stoppoints-discovery:
  // no stop named "Monzie" exists in the API at all right now — genuinely
  // unavailable during the works. Switch to a real Monzie quay once the
  // diversion ends and one reappears in discovery.
  { id: "idna-26-jonelière", monitoringRef: "IDNA1", apiLineRef: "26", lineCode: "26", direction: "Jonelière", stopName: "Île de Nantes (déviation)" },

  // Added 2026-09-22 for the per-user filter feature. Confirmed via the
  // SIRI-Lite stoppoints-discovery.json endpoint plus a live stop-monitoring
  // call to check the actual LineRef/DestinationName served by each quay —
  // several quays can share a stop name, one per direction/line.
  { id: "rpbl-5-garesud",       monitoringRef: "RPBL4", apiLineRef: "5",  lineCode: "5",  direction: "Gare Sud",         stopName: "République"     },
  { id: "rpbl-26-hoteldereg",   monitoringRef: "RPBL1", apiLineRef: "26", lineCode: "26", direction: "Hôtel de Région",  stopName: "République"     },
  { id: "galh-38-greneraie",    monitoringRef: "GALH2", apiLineRef: "38", lineCode: "38", direction: "Greneraie",        stopName: "Galheur"        },
  { id: "dide-t3-marcelpaul",   monitoringRef: "DIDE1", apiLineRef: "3",  lineCode: "T3", direction: "Marcel Paul",      stopName: "Espace Diderot" },
  { id: "lhou-30-trentemoult",  monitoringRef: "LHOU1", apiLineRef: "30", lineCode: "30", direction: "Trentemoult",      stopName: "La Houssais"    },
  { id: "dide-30-ilesdeloire",  monitoringRef: "DIDE5", apiLineRef: "30", lineCode: "30", direction: "Îles de Loire",    stopName: "Espace Diderot" },
  // Replaced 2026-09-22: Martine's stop for this direction is Trocardière,
  // not Neustrie. Confirmed via stoppoints-discovery + a live stop-monitoring
  // check (TROC1 -> line 3, destination "Marcel Paul").
  { id: "troc-t3-marcelpaul",   monitoringRef: "TROC1", apiLineRef: "3",  lineCode: "T3", direction: "Marcel Paul",      stopName: "Trocardière"    },
];

// Official Naolib per-line colors (from line pictogram SVGs)
const LINE_COLORS = {
  T2: { bg: "#E30613", text: "#FFFFFF" },
  T3: { bg: "#2581C4", text: "#FFFFFF" },
  "4": { bg: "#FFCD1C", text: "#111111" },
  "5": { bg: "#0BBBEF", text: "#111111" },
  "38": { bg: "#009640", text: "#FFFFFF" },
  "26": { bg: "#009640", text: "#FFFFFF" },
  "30": { bg: "#F8E700", text: "#111111" },
};

const WINDOW_MINUTES = 30;
const REFRESH_SECONDS = 30;

// Flip this to true only for local UI development without live data.
const USE_MOCK = false;

/* ------------------------------------------------------------------
   USERS: each user's monitored points, in display-priority order.
   Rows are grouped by this order (soonest-first within each point),
   not a single global soonest-first sort — so "my line first" holds
   even when a later line's bus happens to be closer.
   `null` (Yoann) means no restriction: every point, sorted purely by
   soonest time, same as the app's original default behavior.
------------------------------------------------------------------- */
const USERS = ["Valentin", "Marie", "Yoann", "Martine"];

const USER_POINT_IDS = {
  Valentin: ["idna-5", "rpbl-5-garesud", "idna-26-jonelière", "rpbl-26-hoteldereg", "gnra-38-aeroport", "galh-38-greneraie"],
  Marie: ["mgin-t3-neustrie", "dide-t3-marcelpaul", "lhou-30-trentemoult", "dide-30-ilesdeloire"],
  Yoann: null,
  Martine: ["troc-t3-marcelpaul", "mgin-t3-neustrie", "galh-38-greneraie", "gnra-38-aeroport"],
};

const SELECTED_USER_KEY = "bst-selected-user";
let selectedUser = localStorage.getItem(SELECTED_USER_KEY);
if (selectedUser && !USERS.includes(selectedUser)) selectedUser = null;

// Line filter — independent of the user filter, so a line can be isolated
// (or everything shown) without scoping to any one person. Empty set = all
// lines. Combines with the user filter by intersection when both are set.
const activeLineFilters = new Set();

/* ------------------------------------------------------------------
   MOCK DATA — shaped exactly like a real SIRI-Lite StopMonitoring
   response body (Siri.ServiceDelivery.StopMonitoringDelivery[0]
   .MonitoredStopVisit[]), one fake payload per MonitoringRef.
   Swap fetchStopMonitoring() below for a real call when the key
   is ready — nothing else needs to change.
------------------------------------------------------------------- */
function mockResponseFor(monitoringRef) {
  const now = Date.now();
  const mins = (m) => new Date(now + m * 60000).toISOString();

  const fakePassages = {
    MGIN1: [
      { LineRef: "2", PublishedLineName: "T2", DestinationName: "Orvault Grand Val", ExpectedArrivalTime: mins(5) },
      { LineRef: "3", PublishedLineName: "T3", DestinationName: "Marcel Paul",       ExpectedArrivalTime: mins(6) },
      { LineRef: "2", PublishedLineName: "T2", DestinationName: "Orvault Grand Val", ExpectedArrivalTime: mins(12) },
      { LineRef: "3", PublishedLineName: "T3", DestinationName: "Marcel Paul",       ExpectedArrivalTime: mins(21) },
      { LineRef: "2", PublishedLineName: "T2", DestinationName: "Orvault Grand Val", ExpectedArrivalTime: mins(19) },
    ],
    MGIN2: [
      { LineRef: "3", PublishedLineName: "T3", DestinationName: "Neustrie", ExpectedArrivalTime: mins(6) },
      { LineRef: "3", PublishedLineName: "T3", DestinationName: "Neustrie", ExpectedArrivalTime: mins(21) },
    ],
    IDNA1: [
      { LineRef: "5", PublishedLineName: "5", DestinationName: "Hangar à Bananes", ExpectedArrivalTime: mins(5) },
      { LineRef: "5", PublishedLineName: "5", DestinationName: "Hangar à Bananes", ExpectedArrivalTime: mins(17) },
    ],
    GNRA4: [
      { LineRef: "38", PublishedLineName: "38", DestinationName: "Aéroport", ExpectedArrivalTime: mins(26) },
    ],
    BENA1: [
      { LineRef: "4", PublishedLineName: "4", DestinationName: "Foch - Cathédrale", ExpectedArrivalTime: mins(3) },
      { LineRef: "4", PublishedLineName: "4", DestinationName: "Foch - Cathédrale", ExpectedArrivalTime: mins(14) },
    ],
    // Both Monzie quays mocked temporarily — see comment in MONITORED_POINTS above.
    MOZI1: [
      { LineRef: "26", PublishedLineName: "26", DestinationName: "Jonelière", ExpectedArrivalTime: mins(9) },
      { LineRef: "26", PublishedLineName: "26", DestinationName: "Jonelière", ExpectedArrivalTime: mins(24) },
    ],
    MOZI2: [
      { LineRef: "26", PublishedLineName: "26", DestinationName: "Jonelière", ExpectedArrivalTime: mins(16) },
    ],
  };

  const visits = (fakePassages[monitoringRef] || []).map((p, i) => ({
    RecordedAtTime: new Date(now).toISOString(),
    ItemIdentifier: `MOCK:${monitoringRef}:${i}`,
    MonitoringRef: { value: monitoringRef },
    MonitoredVehicleJourney: {
      LineRef: { value: p.LineRef },
      PublishedLineName: [{ value: p.PublishedLineName }],
      DestinationName: [{ value: p.DestinationName }],
      MonitoredCall: {
        ExpectedArrivalTime: p.ExpectedArrivalTime,
      },
    },
  }));

  return {
    Siri: {
      ServiceDelivery: {
        ResponseTimestamp: new Date(now).toISOString(),
        StopMonitoringDelivery: [
          { MonitoredStopVisit: visits },
        ],
      },
    },
  };
}

/* ------------------------------------------------------------------
   Reads data/naolib.json, generated periodically by the GitHub Action
   (scripts/fetch-naolib.mjs). No direct API calls from the browser —
   no CORS/preflight concerns, no exposed API key.
------------------------------------------------------------------- */
async function fetchStopMonitoring(monitoringRef, dataFile) {
  if (USE_MOCK) {
    return mockResponseFor(monitoringRef);
  }

  const visits = dataFile?.stops?.[monitoringRef] ?? [];
  return {
    Siri: {
      ServiceDelivery: {
        StopMonitoringDelivery: [{ MonitoredStopVisit: visits }],
      },
    },
  };
}

function extractVisits(siriResponse) {
  try {
    return siriResponse.Siri.ServiceDelivery.StopMonitoringDelivery[0].MonitoredStopVisit || [];
  } catch (e) {
    return [];
  }
}

function minutesFromNow(isoTime) {
  const diffMs = new Date(isoTime).getTime() - Date.now();
  return Math.round(diffMs / 60000); // can be negative — caller decides what to do with that
}

async function loadAll() {
  const now = new Date();
  document.getElementById("updated").textContent =
    "Mis à jour " + now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // In real mode, fetch the generated data file once per refresh (covers
  // every quay in one request) instead of one call per quay.
  let dataFile = null;
  if (!USE_MOCK) {
    try {
      const res = await fetch("data/naolib.json", { cache: "no-store" });
      if (!res.ok) throw new Error(`Failed to load data/naolib.json: ${res.status}`);
      dataFile = await res.json();
    } catch (err) {
      console.error(err);
      document.getElementById("list").innerHTML =
        `<div class="empty">Impossible de charger les données (data/naolib.json).</div>`;
      return;
    }
  }

  // Group config by monitoringRef to avoid duplicate lookups (Mangin = T2 + T3, same quay)
  const uniqueRefs = [...new Set(MONITORED_POINTS.map(p => p.monitoringRef))];
  const responses = {};
  await Promise.all(uniqueRefs.map(async (ref) => {
    responses[ref] = extractVisits(await fetchStopMonitoring(ref, dataFile));
  }));

  const rows = [];
  for (const point of MONITORED_POINTS) {
    const visits = responses[point.monitoringRef] || [];
    for (const visitـ of visits) {
      const mvj = visitـ.MonitoredVehicleJourney;
      const lineRef = mvj.LineRef?.value;
      if (lineRef !== point.apiLineRef) continue; // filter to the line we care about at this quay

      const arrivalIso = mvj.MonitoredCall?.ExpectedArrivalTime;
      if (!arrivalIso) continue;

      const mins = minutesFromNow(arrivalIso);
      if (mins < 0) continue;   // already departed — hide it
      if (mins > WINDOW_MINUTES) continue;

      rows.push({
        id: point.id,
        line: point.lineCode,
        direction: point.direction,
        stopName: point.stopName,
        minutes: mins,
      });
    }
  }

  renderUserSelector();
  renderLineFilters();
  render(rows);
}

// Display order for the line filter chips (not the fetch/color config order).
const LINE_DISPLAY_ORDER = ["T2", "T3", "4", "5", "26", "30", "38"];

function renderLineFilters() {
  const container = document.getElementById("lineFilters");
  const configured = new Set(MONITORED_POINTS.map(p => p.lineCode));
  const lines = LINE_DISPLAY_ORDER.filter(l => configured.has(l));
  if (container.dataset.built === "true") {
    [...container.children].forEach(chip => {
      chip.classList.toggle("active", activeLineFilters.size === 0 || activeLineFilters.has(chip.dataset.line));
    });
    return;
  }
  container.dataset.built = "true";
  container.innerHTML = "";
  for (const line of lines) {
    const chip = document.createElement("button");
    chip.className = "filter-chip active";
    chip.textContent = line;
    chip.dataset.line = line;
    chip.style.borderColor = (LINE_COLORS[line] || {}).bg || "var(--border)";
    chip.addEventListener("click", () => {
      if (activeLineFilters.has(line)) {
        activeLineFilters.delete(line);
      } else {
        activeLineFilters.add(line);
      }
      // If every line ends up selected, treat as "show all" (empty set)
      if (activeLineFilters.size === lines.length) activeLineFilters.clear();
      loadAll();
    });
    container.appendChild(chip);
  }
}

function renderUserSelector() {
  const container = document.getElementById("filters");
  if (container.dataset.built === "true") {
    [...container.children].forEach(chip => {
      chip.classList.toggle("active", chip.dataset.user === (selectedUser || ""));
    });
    return;
  }
  container.dataset.built = "true";
  container.innerHTML = "";
  for (const user of USERS) {
    const chip = document.createElement("button");
    chip.className = "filter-chip" + (selectedUser === user ? " active" : "");
    chip.textContent = user;
    chip.dataset.user = user;
    chip.addEventListener("click", () => {
      selectedUser = (selectedUser === user) ? null : user;
      if (selectedUser) {
        localStorage.setItem(SELECTED_USER_KEY, selectedUser);
      } else {
        localStorage.removeItem(SELECTED_USER_KEY);
      }
      loadAll();
    });
    container.appendChild(chip);
  }
}

function render(rows) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  const pointIds = selectedUser ? USER_POINT_IDS[selectedUser] : null;

  // Line filter is independent of, and combines with, the user filter —
  // a line can be isolated (or everything shown) without scoping to anyone.
  const lineFiltered = activeLineFilters.size === 0
    ? rows
    : rows.filter(r => activeLineFilters.has(r.line));

  // Group by point (line + direction + stop are one-to-one with a
  // MONITORED_POINTS entry, so grouping by id groups by exactly those three
  // fields) — one row per point, with every upcoming timer instead of one
  // row per passage. Applies whether or not a user is selected.
  const groups = new Map();
  for (const row of lineFiltered) {
    if (!groups.has(row.id)) {
      groups.set(row.id, { line: row.line, direction: row.direction, stopName: row.stopName, times: [] });
    }
    groups.get(row.id).times.push(row.minutes);
  }
  for (const g of groups.values()) g.times.sort((a, b) => a - b);

  let ordered;
  if (!pointIds) {
    // No user selected (or Yoann): every point, soonest-arriving group first.
    ordered = [...groups.values()].sort((a, b) => a.times[0] - b.times[0]);
  } else {
    // The user's configured priority order — "my line first" holds even
    // when another line's next bus is closer.
    ordered = pointIds.map(id => groups.get(id)).filter(Boolean);
  }

  if (ordered.length === 0) {
    list.innerHTML = `<div class="empty">Aucun passage dans les ${WINDOW_MINUTES} prochaines minutes.</div>`;
    return;
  }

  for (const g of ordered) {
    const colors = LINE_COLORS[g.line] || { bg: "#666", text: "#fff" };
    const row = document.createElement("div");
    row.className = "row";
    // Each timer is highlighted individually — only the ones actually ≤5 min
    // turn yellow, not the whole group just because the soonest one qualifies.
    const timesHtml = g.times.map(m => `<span class="${m <= 5 ? 'soon' : ''}">${m} min</span>`).join(", ");
    row.innerHTML = `
      <div class="badge" style="background:${colors.bg};color:${colors.text}">${g.line}</div>
      <div class="info">
        <div class="direction">→ ${g.direction}</div>
        <div class="stop">${g.stopName}</div>
      </div>
      <div class="time ${g.times.length > 1 ? 'multi' : ''}">${timesHtml}</div>
    `;
    list.appendChild(row);
  }
}

loadAll();
setInterval(loadAll, REFRESH_SECONDS * 1000);

document.getElementById("mockNotice").style.display = USE_MOCK ? "block" : "none";

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ------------------------------------------------------------------
   PWA install banner
   - iOS/iPadOS Safari and macOS Safari have no native install prompt,
     so we show manual "Add to Home Screen" / "Add to Dock" instructions.
   - Chrome/Edge/Android expose beforeinstallprompt, so we show a real
     "Install" button that triggers the native dialog.
   - Hidden entirely once the app is already running standalone, or
     if the person dismissed it (remembered for 14 days).
------------------------------------------------------------------- */
(function setupInstallBanner() {
  const DISMISS_KEY = "bst-install-dismissed-until";
  const DISMISS_DAYS = 14;

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true; // iOS Safari flag

  if (isStandalone) return;

  const dismissedUntil = Number(localStorage.getItem(DISMISS_KEY) || 0);
  if (Date.now() < dismissedUntil) return;

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes("Macintosh") && navigator.maxTouchPoints > 1);
  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
  const isMac = /Macintosh/.test(ua) && !isIOS;

  const banner = document.getElementById("installBanner");
  const textEl = document.getElementById("installText");
  const actionBtn = document.getElementById("installAction");
  const dismissBtn = document.getElementById("installDismiss");

  let deferredPrompt = null;

  function show(html) {
    textEl.innerHTML = html;
    banner.classList.add("visible");
  }

  dismissBtn.addEventListener("click", () => {
    localStorage.setItem(DISMISS_KEY, String(Date.now() + DISMISS_DAYS * 86400000));
    banner.classList.remove("visible");
  });

  if (isIOS && isSafari) {
    show(`<strong>Installer BST</strong>Appuyez sur <strong>Partager</strong> (icône carrée avec flèche ↑) puis <strong>Sur l'écran d'accueil</strong>.`);
  } else if (isMac && isSafari) {
    show(`<strong>Installer BST</strong>Cliquez sur <strong>Partager</strong> dans la barre d'outils puis <strong>Ajouter au Dock</strong>.`);
  } else {
    // Chrome / Edge / other browsers supporting the native install prompt
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      show(`<strong>Installer BST</strong>Ajoutez l'app à votre écran d'accueil pour un accès rapide.`);
      actionBtn.style.display = "inline-block";
    });

    actionBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.classList.remove("visible");
    });
  }
})();

</script>

</body>
</html>
